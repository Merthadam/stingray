version: 1
name: App database (stingray.db)
description: >-
  Stingray's SQLite database in userData: tables and columns from the SCHEMA_V* objects in electron/database.ts,
  primary keys from PK(), foreign keys (ON DELETE CASCADE) from FK(...).
kind: tables
scope:
  include: ["electron/database.ts"]
rules:
  - id: table
    language: typescript
    query: |
      (variable_declarator
        name: (identifier) @schema (#match? @schema "^SCHEMA_V[0-9]+$")
        value: (object (pair key: (property_identifier) @table value: (object))))
    emit: { node: { id: "@table", label: "@table", kind: table, subtitle: "@schema" } }
  - id: column
    language: typescript
    query: |
      (variable_declarator
        name: (identifier) @schema (#match? @schema "^SCHEMA_V[0-9]+$")
        value: (object (pair key: (property_identifier) @table
          value: (object (pair key: (property_identifier) @column
            value: [(string (string_fragment) @def)
                    (call_expression function: (identifier) @badge) @def])))))
    emit: { field: { node: "@table", id: "@column", label: "@column", type: "@def", badges: ["@badge"] } }
  - id: composite-key
    language: typescript
    query: |
      (variable_declarator
        name: (identifier) @schema (#match? @schema "^SCHEMA_V[0-9]+$")
        value: (object (pair key: (property_identifier) @table
          value: (object (pair key: (string (string_fragment) @k (#eq? @k "PRIMARY KEY"))
                               value: (string (string_fragment) @cols))))))
    emit: { field: { node: "@table", id: "primary-key", label: "PRIMARY KEY", type: "@cols", badges: ["PK"] } }
  - id: foreign-key
    language: typescript
    query: |
      (variable_declarator
        name: (identifier) @schema (#match? @schema "^SCHEMA_V[0-9]+$")
        value: (object (pair key: (property_identifier) @table
          value: (object (pair key: (property_identifier) @column
            value: (call_expression
              function: (identifier) @fn (#eq? @fn "FK")
              arguments: (arguments . (string (string_fragment) @target))))))))
    emit: { edge: { from: "@table", to: "@target", label: "@column → id (cascade)", kind: foreign-key } }
